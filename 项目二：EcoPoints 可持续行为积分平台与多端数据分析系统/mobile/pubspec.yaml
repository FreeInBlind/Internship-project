name: ecopoints_mobile
description: EcoPoints Android companion for walking and cycling GPX recording.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^13.0.2
  http: ^1.2.2
  path_provider: ^2.1.5
  share_plus: ^10.1.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
